name: Model checks

on:
  pull_request:
    branches: [model-v0.1, main]
  push:
    branches: [model-v0.1, model-v0.1-aspic-foundation, model-v0.1-question-navigation, main]

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: reasoning/requirements.txt
      - run: npm ci
      - run: python -m pip install -r reasoning/requirements.txt
      - run: npm test
      - run: npm run test:reasoning
      - run: npm run reasoning:pilot
      - run: npm run build
      - run: npm run test:routes
